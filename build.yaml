# ZMK build matrix (see .github/workflows/build-zmk.yml)
---
include:
  - board: nice_nano_v2
    shield: yoga_split_left nice_view_adapter nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: yoga_split_left
  - board: nice_nano_v2
    shield: yoga_split_right nice_view_adapter nice_view
    artifact-name: yoga_split_right
  # cheaper build: no nice!view on the right half (the left screen shows status)
  - board: nice_nano_v2
    shield: yoga_split_right
    artifact-name: yoga_split_right_noscreen
  - board: nice_nano_v2
    shield: yoga_mono nice_view_adapter nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: yoga_mono
  # status LEDs instead of screens (fit the three 3 mm LEDs, not the nice!view).
  # The shield .conf files turn the display on, so these builds turn it off again.
  - board: nice_nano_v2
    shield: yoga_split_left yoga_status_leds
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_DISPLAY=n
    artifact-name: yoga_split_left_leds
  - board: nice_nano_v2
    shield: yoga_split_right yoga_status_leds
    cmake-args: -DCONFIG_ZMK_DISPLAY=n
    artifact-name: yoga_split_right_leds
  - board: nice_nano_v2
    shield: yoga_mono yoga_status_leds
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_DISPLAY=n
    artifact-name: yoga_mono_leds
  # 3-row variant (ergogen-3row/, pcb-3row/): 3 x 6 + 3 per half, key blocks angled inward.
  # Same pins and charge link; the status-LED shield works with it too.
  - board: nice_nano_v2
    shield: yoga3_split_left nice_view_adapter nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: yoga3_split_left
  - board: nice_nano_v2
    shield: yoga3_split_right nice_view_adapter nice_view
    artifact-name: yoga3_split_right
  - board: nice_nano_v2
    shield: yoga3_mono nice_view_adapter nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: yoga3_mono
  # thin PG1316S build (ergogen-thin/, pcb-thin/): same matrix and pins as the 3-row, status LEDs only
  - board: nice_nano_v2
    shield: yoga3_split_left yoga_status_leds
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_DISPLAY=n
    artifact-name: yoga3_split_left_leds
  - board: nice_nano_v2
    shield: yoga3_split_right yoga_status_leds
    cmake-args: -DCONFIG_ZMK_DISPLAY=n
    artifact-name: yoga3_split_right_leds
  - board: nice_nano_v2
    shield: yoga3_mono yoga_status_leds
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_DISPLAY=n
    artifact-name: yoga3_mono_leds
  - board: nice_nano_v2
    shield: settings_reset
