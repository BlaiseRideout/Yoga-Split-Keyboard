# Yoga Book 9i Gen 9 low-profile split keyboard, THIN variant with PG1316S switches (generated by tools/make_thin.py from the 3-row config,
# which is generated by tools/make_3row.py:
# edit ergogen/config.yaml or the script, not this file). Key blocks rotated 10 deg inward.
# One ergogen config produces three PCBs: split left, split right, and monolithic.
# Coordinates in mm. Board envelope = stock keyboard footprint 295.3 x 113 mm.
meta:
  engine: 4.2.1
  name: yoga-split-thin
  version: 0.1
  author: BlaiseRideout
units:
  kx: 18          # Choc keycap spacing (horizontal)
  ky: 17          # Choc keycap spacing (vertical)
  board_w: 295.3  # stock keyboard width
  board_h: 113    # stock keyboard depth
  cx: 131         # board centre x (split line)
  cy: 18.6        # board centre y
  wall: 2.5       # case wall + clearance -> PCB inset
  join_wall: 5.5  # thicker inner wall on split halves (holds joining magnets)
points:
  key:
    width: 17.5
    height: 16.5
    spread: kx
    padding: ky
    tags: [key]
  zones:
    matrix:
      anchor: {shift: [-3, 17], rotate: -10}
      columns:
        outer:
          key: {stagger: 0, column_net: C0, col_i: 0}
          rows:
            top: {mono_row: MR0, mono_col: MC0, mirror: {mono_row: MR3, mono_col: MC0}}
            home: {mono_row: MR1, mono_col: MC0, mirror: {mono_row: MR4, mono_col: MC0}}
            bottom: {mono_row: MR2, mono_col: MC0, mirror: {mono_row: MR5, mono_col: MC0}}
        pinky:
          key: {stagger: 0, column_net: C1, col_i: 1}
          rows:
            top: {mono_row: MR0, mono_col: MC1, mirror: {mono_row: MR3, mono_col: MC1}}
            home: {mono_row: MR1, mono_col: MC1, mirror: {mono_row: MR4, mono_col: MC1}}
            bottom: {mono_row: MR2, mono_col: MC1, mirror: {mono_row: MR5, mono_col: MC1}}
        ring:
          key: {stagger: 6, column_net: C2, col_i: 2}
          rows:
            top: {mono_row: MR0, mono_col: MC2, mirror: {mono_row: MR3, mono_col: MC2}}
            home: {mono_row: MR1, mono_col: MC2, mirror: {mono_row: MR4, mono_col: MC2}}
            bottom: {mono_row: MR2, mono_col: MC2, mirror: {mono_row: MR5, mono_col: MC2}}
        middle:
          key: {stagger: 3, column_net: C3, col_i: 3}
          rows:
            top: {mono_row: MR0, mono_col: MC3, mirror: {mono_row: MR3, mono_col: MC3}}
            home: {mono_row: MR1, mono_col: MC3, mirror: {mono_row: MR4, mono_col: MC3}}
            bottom: {mono_row: MR2, mono_col: MC3, mirror: {mono_row: MR5, mono_col: MC3}}
        index:
          key: {stagger: -3, column_net: C4, col_i: 4}
          rows:
            top: {mono_row: MR0, mono_col: MC4, mirror: {mono_row: MR3, mono_col: MC4}}
            home: {mono_row: MR1, mono_col: MC4, mirror: {mono_row: MR4, mono_col: MC4}}
            bottom: {mono_row: MR2, mono_col: MC4, mirror: {mono_row: MR5, mono_col: MC4}}
        inner:
          key: {stagger: -3, column_net: C5, col_i: 5}
          rows:
            top: {mono_row: MR0, mono_col: MC5, mirror: {mono_row: MR3, mono_col: MC5}}
            home: {mono_row: MR1, mono_col: MC5, mirror: {mono_row: MR4, mono_col: MC5}}
            bottom: {mono_row: MR2, mono_col: MC5, mirror: {mono_row: MR5, mono_col: MC5}}
      rows:
        bottom: {row_net: R2, row_i: 2}
        home: {row_net: R1, row_i: 1}
        top: {row_net: R0, row_i: 0}
    thumb:
      anchor:
        ref: matrix_index_bottom
        shift: [-4, -19.5]
      columns:
        tucky:
          key: {mono_row: MR0, mono_col: MC6, mirror: {mono_row: MR3, mono_col: MC6}, column_net: C3, col_i: 3}
        home:
          key: {mono_row: MR1, mono_col: MC6, mirror: {mono_row: MR4, mono_col: MC6}, splay: -10, origin: [-9, -8.5], column_net: C4, col_i: 4}
        reachy:
          key: {mono_row: MR2, mono_col: MC6, mirror: {mono_row: MR5, mono_col: MC6}, splay: -10, origin: [-9, -8.5], column_net: C5, col_i: 5}
      rows:
        one: {row_net: R3, row_i: 3}
  mirror:
    ref: matrix_inner_bottom
    distance: 89.693   # puts the mirror axis at x = cx
outlines:
  keycaps:   # 16.05 x 16.25 PG1316S keycaps (for previews)
    - what: rectangle
      where: true
      size: [16.05, 16.25]
  # full outer envelope of the keyboard (matches stock keyboard)
  envelope:
    - what: rectangle
      size: [board_w, board_h]
      corner: 6
      adjust.shift: [cx, cy]
  # PCB of the monolithic board
  _pcb_base:
    - what: rectangle
      size: [board_w - 2*wall, board_h - 2*wall]
      corner: 3.5
      adjust.shift: [cx, cy]
    - what: rectangle
      operation: subtract
      size: [41, 40]
      adjust.shift: [16, -23]
    - what: rectangle
      operation: subtract
      size: [41, 40]
      adjust.shift: [246, -23]
  pcb_mono:
    - _pcb_base
    - what: rectangle
      operation: subtract
      size: [9.14, 6.5]
      adjust.shift: [136.9, 70.35]
  _left_clip:
    - what: rectangle
      size: [board_w/2, board_h + 10]
      adjust.shift: [cx - board_w/4 - join_wall, cy]
  _right_clip:
    - what: rectangle
      size: [board_w/2, board_h + 10]
      adjust.shift: [cx + board_w/4 + join_wall, cy]
  pcb_left:
    - _pcb_base
    - what: rectangle
      operation: subtract
      size: [9.14, 6.5]
      adjust.shift: [118.9, 70.35]
    - ~_left_clip
  pcb_right:
    - _pcb_base
    - what: rectangle
      operation: subtract
      size: [9.14, 6.5]
      adjust.shift: [143.1, 70.35]
    - ~_right_clip
  # envelope halves (case outer shape of each split half)
  _env_left_clip:
    - what: rectangle
      size: [board_w/2, board_h + 10]
      adjust.shift: [cx - board_w/4, cy]
  _env_right_clip:
    - what: rectangle
      size: [board_w/2, board_h + 10]
      adjust.shift: [cx + board_w/4, cy]
  envelope_left:
    - envelope
    - ~_env_left_clip
  envelope_right:
    - envelope
    - ~_env_right_clip
  # keycap clearance cutouts for the case top frame
  caps:
    - what: rectangle
      where: true
      size: [17.05, 17.25]
  preview_mono:
    - envelope
    - -caps
pcbs:
  left:
    template: kicad5
    outlines:
      edge:
        outline: pcb_left
        layer: Edge.Cuts
    footprints:
      switch:
        what: pg1316s
        where: /^(matrix|thumb)_/
        params: {from: "{{colrow}}", to: "{{column_net}}", keycaps: true}
      diode:
        what: diode_sod123
        where: /^(matrix|thumb)_/
        adjust: {shift: [9, 0], rotate: 90}
        params: {side: F, from: "{{colrow}}", to: "{{row_net}}"}
      power:
        what: power_switch
        adjust: {shift: [93, 68], rotate: 0}
        params: {from: BAT_P, to: SW_OUT}
      battery:
        what: battery_pads
        adjust: {shift: [39.5, -8], rotate: 90}
        params: {pos: BAT_P, neg: GND}
      chg_link:
        what: charge_link
        adjust: {shift: [125.5, 28], rotate: 0}
        params: {a: LINK_B, b: GND, kind: male, tht: true}
      chg_fuse:
        what: smd_1206
        adjust: {shift: [121.5, 22], rotate: 90}
        params: {designator: F, side: F, from: CHG_IN, to: LINK_B, value: "PTC 0.2A hold 1206"}
      # ESD clamp on the exposed charge-link contact (SMF5.0A, SOD-123FL, 5 V standoff)
      chg_tvs:
        what: diode_sod123
        adjust: {shift: [124.2, 20], rotate: 90}
        params: {designator: D, side: F, from: GND, to: LINK_B}
      # status LEDs (0805, red/green/blue) on the display pins, driven by zmk-rgbled-widget
      led_r:
        what: smd_0805
        adjust: {shift: [119.5, 3], rotate: 0}
        params: {designator: LED, led: true, from: LED_R, to: GND, value: "red LED 0805"}
      led_r_res:
        what: smd_0805
        adjust: {shift: [123.2, 3], rotate: 0}
        params: {designator: R, from: CS, to: LED_R, value: "680R 0805"}
      led_g:
        what: smd_0805
        adjust: {shift: [119.5, 6.5], rotate: 0}
        params: {designator: LED, led: true, from: LED_G, to: GND, value: "green LED 0805"}
      led_g_res:
        what: smd_0805
        adjust: {shift: [123.2, 6.5], rotate: 0}
        params: {designator: R, from: MOSI, to: LED_G, value: "150R 0805"}
      led_b:
        what: smd_0805
        adjust: {shift: [119.5, 10], rotate: 0}
        params: {designator: LED, led: true, from: LED_B, to: GND, value: "blue LED 0805"}
      led_b_res:
        what: smd_0805
        adjust: {shift: [123.2, 10], rotate: 0}
        params: {designator: R, from: SCK, to: LED_B, value: "150R 0805"}
      # on-board controller: Raytac MDBT50Q-1MV2 (nRF52840), antenna at the back edge
      mcu:
        what: mdbt50q
        adjust: {shift: [106.3, 64.85], rotate: 0}
        params: {designator: IC, value: "MDBT50Q-1MV2", P1: GND, P2: GND, P3: C0, P4: C1, P6: C2, P8: C3, P10: C4, P12: C5, P15: GND, P16: R0, P17: XL1, P18: XL2, P20: R1, P22: R2, P24: R3, P28: VDD, P30: RAW, P32: VBUS, P33: GND, P34: USB_DM, P35: USB_DP, P44: CS, P46: MOSI, P48: SCK, P51: SWDIO, P53: SWDCLK, P55: GND}
      usb:
        what: usbc_mid
        adjust: {shift: [118.9, 67.1], rotate: 0}
        params: {designator: J, value: "USB-C 16P mid-mount", A1: GND, S1: GND, A4: VBUS, A5: CC1, B5: CC2, A6: USB_DP, B6: USB_DP, A7: USB_DM, B7: USB_DM}
      esd:
        what: sot23
        adjust: {shift: [118.9, 62], rotate: 0}
        params: {designator: IC, value: "USBLC6-2SC6", P1: USB_DP, P6: USB_DP, P3: USB_DM, P4: USB_DM, P2: GND, P5: VBUS}
      r_cc1:
        what: smd_0805
        adjust: {shift: [122.6, 62], rotate: 90}
        params: {designator: R, from: CC1, to: GND, value: "5.1k 0805"}
      r_cc2:
        what: smd_0805
        adjust: {shift: [115.2, 62], rotate: 90}
        params: {designator: R, from: CC2, to: GND, value: "5.1k 0805"}
      # Li-ion charger, 100 mA (PROG 10k); its CHRG output is unused. On the split halves it runs from
      # CHG_IN: this half's USB 5 V through a Schottky, or the other half's over the charge link
      chg:
        what: sot23
        adjust: {shift: [118.9, 56], rotate: 0}
        params: {designator: IC, value: "TP4054", pins: 5, P2: GND, P3: BAT_P, P4: CHG_IN, P5: PROG}
      r_prog:
        what: smd_0805
        adjust: {shift: [122.6, 56], rotate: 90}
        params: {designator: R, from: PROG, to: GND, value: "10k 0805"}
      c_chg:
        what: smd_0805
        adjust: {shift: [115.2, 56], rotate: 90}
        params: {designator: C, from: CHG_IN, to: GND, value: "4.7uF 0805"}
      c_bat:
        what: smd_0805
        adjust: {shift: [118.9, 52.5], rotate: 0}
        params: {designator: C, from: BAT_P, to: GND, value: "4.7uF 0805"}
      # power path as on the nRFMicro: USB feeds RAW through the Schottky and turns the P-MOSFET off;
      # without USB the MOSFET connects the (switched) cell to RAW. RAW is the nRF52840's VDDH.
      q_pp:
        what: sot23_3
        adjust: {shift: [122.6, 50.5], rotate: 0}
        params: {designator: Q, value: "AO3401A", P1: VBUS, P2: RAW, P3: SW_OUT}
      r_gate:
        what: smd_0805
        adjust: {shift: [115.2, 50.5], rotate: 90}
        params: {designator: R, from: VBUS, to: GND, value: "100k 0805"}
      d_pp:
        what: diode_sod123
        adjust: {shift: [118.9, 48], rotate: 0}
        params: {designator: D, side: F, from: VBUS, to: RAW, value: "B5819W"}
      c_vdd:
        what: smd_0805
        adjust: {shift: [107.9, 54.5], rotate: 90}
        params: {designator: C, from: VDD, to: GND, value: "4.7uF 0805"}
      c_vddh:
        what: smd_0805
        adjust: {shift: [110.4, 54.5], rotate: 90}
        params: {designator: C, from: RAW, to: GND, value: "4.7uF 0805"}
      c_vbus:
        what: smd_0805
        adjust: {shift: [112.9, 54.5], rotate: 90}
        params: {designator: C, from: VBUS, to: GND, value: "4.7uF 0805"}
      xtal:
        what: xtal_3215
        adjust: {shift: [103.5, 54.5], rotate: 0}
        params: {designator: Y, value: "32.768kHz 12.5pF", P1: XL2, P2: XL1}
      c_xl1:
        what: smd_0805
        adjust: {shift: [102.25, 51], rotate: 90}
        params: {designator: C, from: XL1, to: GND, value: "20pF 0805"}
      c_xl2:
        what: smd_0805
        adjust: {shift: [104.75, 51], rotate: 90}
        params: {designator: C, from: XL2, to: GND, value: "20pF 0805"}
      swd:
        what: swd_pads
        adjust: {shift: [106.5, 45.5], rotate: 0}
        params: {}
      d_chg:
        what: diode_sod123
        adjust: {shift: [118.9, 59], rotate: 0}
        params: {designator: D, side: F, from: VBUS, to: CHG_IN, value: "B5819W"}
      h1: {what: mounting_hole, adjust.shift: [-8, 66]}
      h2: {what: mounting_hole, adjust.shift: [-8, -28]}
      h3: {what: mounting_hole, adjust.shift: [40, -24]}
      h4: {what: mounting_hole, adjust.shift: [47.5, 69]}
      h5: {what: mounting_hole, adjust.shift: [98.8, 63]}
      h6: {what: mounting_hole, adjust.shift: [122.5, -30]}

  right:
    template: kicad5
    outlines:
      edge:
        outline: pcb_right
        layer: Edge.Cuts
    footprints:
      switch:
        what: pg1316s
        where: /^mirror_/
        params: {from: "{{colrow}}", to: "{{column_net}}", keycaps: true}
      diode:
        what: diode_sod123
        where: /^mirror_/
        adjust: {shift: [9, 0], rotate: 90}
        params: {side: F, from: "{{colrow}}", to: "{{row_net}}"}
      power:
        what: power_switch
        adjust: {shift: [169, 68], rotate: 0}
        params: {from: BAT_P, to: SW_OUT}
      battery:
        what: battery_pads
        adjust: {shift: [222.5, -8], rotate: 90}
        params: {pos: BAT_P, neg: GND}
      chg_link:
        what: charge_link
        adjust: {shift: [136.5, 28], rotate: 180}
        params: {a: GND, b: LINK_B, kind: female, tht: true}
      chg_fuse:
        what: smd_1206
        adjust: {shift: [140.5, 22], rotate: 90}
        params: {designator: F, side: F, from: CHG_IN, to: LINK_B, value: "PTC 0.2A hold 1206"}
      # ESD clamp on the exposed charge-link contact (SMF5.0A, SOD-123FL, 5 V standoff)
      chg_tvs:
        what: diode_sod123
        adjust: {shift: [137.8, 20], rotate: 90}
        params: {designator: D, side: F, from: GND, to: LINK_B}
      # status LEDs (0805, red/green/blue) on the display pins, driven by zmk-rgbled-widget
      led_r:
        what: smd_0805
        adjust: {shift: [142.5, 3], rotate: 0}
        params: {designator: LED, led: true, from: LED_R, to: GND, value: "red LED 0805"}
      led_r_res:
        what: smd_0805
        adjust: {shift: [138.8, 3], rotate: 0}
        params: {designator: R, from: CS, to: LED_R, value: "680R 0805"}
      led_g:
        what: smd_0805
        adjust: {shift: [142.5, 6.5], rotate: 0}
        params: {designator: LED, led: true, from: LED_G, to: GND, value: "green LED 0805"}
      led_g_res:
        what: smd_0805
        adjust: {shift: [138.8, 6.5], rotate: 0}
        params: {designator: R, from: MOSI, to: LED_G, value: "150R 0805"}
      led_b:
        what: smd_0805
        adjust: {shift: [142.5, 10], rotate: 0}
        params: {designator: LED, led: true, from: LED_B, to: GND, value: "blue LED 0805"}
      led_b_res:
        what: smd_0805
        adjust: {shift: [138.8, 10], rotate: 0}
        params: {designator: R, from: SCK, to: LED_B, value: "150R 0805"}
      # on-board controller: Raytac MDBT50Q-1MV2 (nRF52840), antenna at the back edge
      mcu:
        what: mdbt50q
        adjust: {shift: [155.7, 64.85], rotate: 0}
        params: {designator: IC, value: "MDBT50Q-1MV2", P1: GND, P2: GND, P3: C0, P4: C1, P6: C2, P8: C3, P10: C4, P12: C5, P15: GND, P16: R0, P17: XL1, P18: XL2, P20: R1, P22: R2, P24: R3, P28: VDD, P30: RAW, P32: VBUS, P33: GND, P34: USB_DM, P35: USB_DP, P44: CS, P46: MOSI, P48: SCK, P51: SWDIO, P53: SWDCLK, P55: GND}
      usb:
        what: usbc_mid
        adjust: {shift: [143.1, 67.1], rotate: 0}
        params: {designator: J, value: "USB-C 16P mid-mount", A1: GND, S1: GND, A4: VBUS, A5: CC1, B5: CC2, A6: USB_DP, B6: USB_DP, A7: USB_DM, B7: USB_DM}
      esd:
        what: sot23
        adjust: {shift: [143.1, 62], rotate: 0}
        params: {designator: IC, value: "USBLC6-2SC6", P1: USB_DP, P6: USB_DP, P3: USB_DM, P4: USB_DM, P2: GND, P5: VBUS}
      r_cc1:
        what: smd_0805
        adjust: {shift: [146.8, 62], rotate: 90}
        params: {designator: R, from: CC1, to: GND, value: "5.1k 0805"}
      r_cc2:
        what: smd_0805
        adjust: {shift: [139.4, 62], rotate: 90}
        params: {designator: R, from: CC2, to: GND, value: "5.1k 0805"}
      # Li-ion charger, 100 mA (PROG 10k); its CHRG output is unused. On the split halves it runs from
      # CHG_IN: this half's USB 5 V through a Schottky, or the other half's over the charge link
      chg:
        what: sot23
        adjust: {shift: [143.1, 56], rotate: 0}
        params: {designator: IC, value: "TP4054", pins: 5, P2: GND, P3: BAT_P, P4: CHG_IN, P5: PROG}
      r_prog:
        what: smd_0805
        adjust: {shift: [146.8, 56], rotate: 90}
        params: {designator: R, from: PROG, to: GND, value: "10k 0805"}
      c_chg:
        what: smd_0805
        adjust: {shift: [139.4, 56], rotate: 90}
        params: {designator: C, from: CHG_IN, to: GND, value: "4.7uF 0805"}
      c_bat:
        what: smd_0805
        adjust: {shift: [143.1, 52.5], rotate: 0}
        params: {designator: C, from: BAT_P, to: GND, value: "4.7uF 0805"}
      # power path as on the nRFMicro: USB feeds RAW through the Schottky and turns the P-MOSFET off;
      # without USB the MOSFET connects the (switched) cell to RAW. RAW is the nRF52840's VDDH.
      q_pp:
        what: sot23_3
        adjust: {shift: [146.8, 50.5], rotate: 0}
        params: {designator: Q, value: "AO3401A", P1: VBUS, P2: RAW, P3: SW_OUT}
      r_gate:
        what: smd_0805
        adjust: {shift: [139.4, 50.5], rotate: 90}
        params: {designator: R, from: VBUS, to: GND, value: "100k 0805"}
      d_pp:
        what: diode_sod123
        adjust: {shift: [143.1, 48], rotate: 0}
        params: {designator: D, side: F, from: VBUS, to: RAW, value: "B5819W"}
      c_vdd:
        what: smd_0805
        adjust: {shift: [154.1, 54.5], rotate: 90}
        params: {designator: C, from: VDD, to: GND, value: "4.7uF 0805"}
      c_vddh:
        what: smd_0805
        adjust: {shift: [151.6, 54.5], rotate: 90}
        params: {designator: C, from: RAW, to: GND, value: "4.7uF 0805"}
      c_vbus:
        what: smd_0805
        adjust: {shift: [149.1, 54.5], rotate: 90}
        params: {designator: C, from: VBUS, to: GND, value: "4.7uF 0805"}
      xtal:
        what: xtal_3215
        adjust: {shift: [158.5, 54.5], rotate: 0}
        params: {designator: Y, value: "32.768kHz 12.5pF", P1: XL2, P2: XL1}
      c_xl1:
        what: smd_0805
        adjust: {shift: [159.75, 51], rotate: 90}
        params: {designator: C, from: XL1, to: GND, value: "20pF 0805"}
      c_xl2:
        what: smd_0805
        adjust: {shift: [157.25, 51], rotate: 90}
        params: {designator: C, from: XL2, to: GND, value: "20pF 0805"}
      swd:
        what: swd_pads
        adjust: {shift: [155.5, 45.5], rotate: 0}
        params: {}
      d_chg:
        what: diode_sod123
        adjust: {shift: [143.1, 59], rotate: 0}
        params: {designator: D, side: F, from: VBUS, to: CHG_IN, value: "B5819W"}
      h1: {what: mounting_hole, adjust.shift: [270, 66]}
      h2: {what: mounting_hole, adjust.shift: [270, -28]}
      h3: {what: mounting_hole, adjust.shift: [222, -24]}
      h4: {what: mounting_hole, adjust.shift: [214.5, 69]}
      h5: {what: mounting_hole, adjust.shift: [163.2, 63]}
      h6: {what: mounting_hole, adjust.shift: [139.5, -30]}

  mono:
    template: kicad5
    outlines:
      edge:
        outline: pcb_mono
        layer: Edge.Cuts
    footprints:
      switch:
        what: pg1316s
        where: /^(matrix|thumb|mirror)_/
        params: {from: "{{colrow}}", to: "{{mono_col}}", keycaps: true}
      diode:
        what: diode_sod123
        where: /^(matrix|thumb|mirror)_/
        adjust: {shift: [9, 0], rotate: 90}
        params: {side: F, from: "{{colrow}}", to: "{{mono_row}}"}
      power:
        what: power_switch
        adjust: {shift: [111, 68], rotate: 0}
        params: {from: BAT_P, to: SW_OUT}
      battery:
        what: battery_pads
        adjust: {shift: [39.5, -8], rotate: 90}
        params: {pos: BAT_P, neg: GND}
      # status LEDs (0805, red/green/blue) on the display pins, driven by zmk-rgbled-widget
      led_r:
        what: smd_0805
        adjust: {shift: [137.5, 3], rotate: 0}
        params: {designator: LED, led: true, from: LED_R, to: GND, value: "red LED 0805"}
      led_r_res:
        what: smd_0805
        adjust: {shift: [141.2, 3], rotate: 0}
        params: {designator: R, from: CS, to: LED_R, value: "680R 0805"}
      led_g:
        what: smd_0805
        adjust: {shift: [137.5, 6.5], rotate: 0}
        params: {designator: LED, led: true, from: LED_G, to: GND, value: "green LED 0805"}
      led_g_res:
        what: smd_0805
        adjust: {shift: [141.2, 6.5], rotate: 0}
        params: {designator: R, from: MOSI, to: LED_G, value: "150R 0805"}
      led_b:
        what: smd_0805
        adjust: {shift: [137.5, 10], rotate: 0}
        params: {designator: LED, led: true, from: LED_B, to: GND, value: "blue LED 0805"}
      led_b_res:
        what: smd_0805
        adjust: {shift: [141.2, 10], rotate: 0}
        params: {designator: R, from: SCK, to: LED_B, value: "150R 0805"}
      # on-board controller: Raytac MDBT50Q-1MV2 (nRF52840), antenna at the back edge
      mcu:
        what: mdbt50q
        adjust: {shift: [124.3, 64.85], rotate: 0}
        params: {designator: IC, value: "MDBT50Q-1MV2", P1: GND, P2: GND, P3: MC0, P4: MC1, P6: MC2, P8: MC3, P10: MC4, P12: MC5, P14: MC6, P15: GND, P16: MR0, P17: XL1, P18: XL2, P20: MR1, P22: MR2, P24: MR3, P26: MR4, P28: VDD, P30: RAW, P32: VBUS, P33: GND, P34: USB_DM, P35: USB_DP, P41: MR5, P44: CS, P46: MOSI, P48: SCK, P51: SWDIO, P53: SWDCLK, P55: GND}
      usb:
        what: usbc_mid
        adjust: {shift: [136.9, 67.1], rotate: 0}
        params: {designator: J, value: "USB-C 16P mid-mount", A1: GND, S1: GND, A4: VBUS, A5: CC1, B5: CC2, A6: USB_DP, B6: USB_DP, A7: USB_DM, B7: USB_DM}
      esd:
        what: sot23
        adjust: {shift: [136.9, 62], rotate: 0}
        params: {designator: IC, value: "USBLC6-2SC6", P1: USB_DP, P6: USB_DP, P3: USB_DM, P4: USB_DM, P2: GND, P5: VBUS}
      r_cc1:
        what: smd_0805
        adjust: {shift: [140.6, 62], rotate: 90}
        params: {designator: R, from: CC1, to: GND, value: "5.1k 0805"}
      r_cc2:
        what: smd_0805
        adjust: {shift: [133.2, 62], rotate: 90}
        params: {designator: R, from: CC2, to: GND, value: "5.1k 0805"}
      # Li-ion charger, 100 mA (PROG 10k); its CHRG output is unused. On the split halves it runs from
      # CHG_IN: this half's USB 5 V through a Schottky, or the other half's over the charge link
      chg:
        what: sot23
        adjust: {shift: [136.9, 56], rotate: 0}
        params: {designator: IC, value: "TP4054", pins: 5, P2: GND, P3: BAT_P, P4: VBUS, P5: PROG}
      r_prog:
        what: smd_0805
        adjust: {shift: [140.6, 56], rotate: 90}
        params: {designator: R, from: PROG, to: GND, value: "10k 0805"}
      c_chg:
        what: smd_0805
        adjust: {shift: [133.2, 56], rotate: 90}
        params: {designator: C, from: VBUS, to: GND, value: "4.7uF 0805"}
      c_bat:
        what: smd_0805
        adjust: {shift: [136.9, 52.5], rotate: 0}
        params: {designator: C, from: BAT_P, to: GND, value: "4.7uF 0805"}
      # power path as on the nRFMicro: USB feeds RAW through the Schottky and turns the P-MOSFET off;
      # without USB the MOSFET connects the (switched) cell to RAW. RAW is the nRF52840's VDDH.
      q_pp:
        what: sot23_3
        adjust: {shift: [140.6, 50.5], rotate: 0}
        params: {designator: Q, value: "AO3401A", P1: VBUS, P2: RAW, P3: SW_OUT}
      r_gate:
        what: smd_0805
        adjust: {shift: [133.2, 50.5], rotate: 90}
        params: {designator: R, from: VBUS, to: GND, value: "100k 0805"}
      d_pp:
        what: diode_sod123
        adjust: {shift: [136.9, 48], rotate: 0}
        params: {designator: D, side: F, from: VBUS, to: RAW, value: "B5819W"}
      c_vdd:
        what: smd_0805
        adjust: {shift: [125.9, 54.5], rotate: 90}
        params: {designator: C, from: VDD, to: GND, value: "4.7uF 0805"}
      c_vddh:
        what: smd_0805
        adjust: {shift: [128.4, 54.5], rotate: 90}
        params: {designator: C, from: RAW, to: GND, value: "4.7uF 0805"}
      c_vbus:
        what: smd_0805
        adjust: {shift: [130.9, 54.5], rotate: 90}
        params: {designator: C, from: VBUS, to: GND, value: "4.7uF 0805"}
      xtal:
        what: xtal_3215
        adjust: {shift: [121.5, 54.5], rotate: 0}
        params: {designator: Y, value: "32.768kHz 12.5pF", P1: XL2, P2: XL1}
      c_xl1:
        what: smd_0805
        adjust: {shift: [120.25, 51], rotate: 90}
        params: {designator: C, from: XL1, to: GND, value: "20pF 0805"}
      c_xl2:
        what: smd_0805
        adjust: {shift: [122.75, 51], rotate: 90}
        params: {designator: C, from: XL2, to: GND, value: "20pF 0805"}
      swd:
        what: swd_pads
        adjust: {shift: [124.5, 45.5], rotate: 0}
        params: {}
      h1: {what: mounting_hole, adjust.shift: [-8, 66]}
      h2: {what: mounting_hole, adjust.shift: [-8, -28]}
      h3: {what: mounting_hole, adjust.shift: [40, -24]}
      h4: {what: mounting_hole, adjust.shift: [47.5, 69]}
      h5: {what: mounting_hole, adjust.shift: [98.8, 63]}
      h6: {what: mounting_hole, adjust.shift: [122.5, -30]}
      h7: {what: mounting_hole, adjust.shift: [270, 66]}
      h8: {what: mounting_hole, adjust.shift: [270, -28]}
      h9: {what: mounting_hole, adjust.shift: [222, -24]}
      h10: {what: mounting_hole, adjust.shift: [214.5, 69]}
      h11: {what: mounting_hole, adjust.shift: [163.2, 63]}
      h12: {what: mounting_hole, adjust.shift: [139.5, -30]}

