# User settings, from BlaiseRideout/zmk-configs link/link.conf (display and sleep are set by the shield)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7

# mouse keys (MOUSE layer)
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=n

# n-key rollover: every key has its own diode, so any combination registers.
# NKRO HID report over USB and BLE (a few BIOS/boot menus only understand 6KRO;
# switch back by deleting this line if one ever ignores the keyboard).
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
