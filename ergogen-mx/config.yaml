# Yoga Book 9i Gen 9 low-profile split keyboard -- MX-SPACED VARIANT (19.05 mm)
# Same matrix, nets and controller pins as ../ergogen/config.yaml (so the same ZMK shields work);
# keys at 19.05 mm for Choc v2 (MX stem) switches with MX-size low-profile keycaps.
# One ergogen config produces three PCBs: split left, split right, and monolithic.
# Coordinates in mm. Board envelope = stock keyboard footprint 295.3 x 113 mm.
meta:
  engine: 4.2.1
  name: yoga-split-mx
  version: 0.1
  author: BlaiseRideout
units:
  kx: 19.05       # MX spacing
  ky: 19.05
  board_w: 295.3  # stock keyboard width
  board_h: 113    # stock keyboard depth
  cx: 131.15      # board centre x (split line)
  cy: 22.2        # board centre y
  wall: 2.5       # case wall + clearance -> PCB inset
  join_wall: 5.5  # thicker inner wall on split halves (holds joining magnets)
points:
  key:
    width: 18
    height: 18
    spread: kx
    padding: ky
    tags: [key]
  zones:
    matrix:
      columns:
        outer:
          key: {stagger: 0, column_net: C0, col_i: 0}
          rows:
            num: {mono_row: MR0, mono_col: MC0, mirror: {mono_row: MR3, mono_col: MC0}}
            top: {mono_row: MR0, mono_col: MC6, mirror: {mono_row: MR3, mono_col: MC6}}
            home: {mono_row: MR1, mono_col: MC3, mirror: {mono_row: MR4, mono_col: MC3}}
            bottom: {mono_row: MR2, mono_col: MC0, mirror: {mono_row: MR5, mono_col: MC0}}
        pinky:
          key: {stagger: 0, column_net: C1, col_i: 1}
          rows:
            num: {mono_row: MR0, mono_col: MC1, mirror: {mono_row: MR3, mono_col: MC1}}
            top: {mono_row: MR0, mono_col: MC7, mirror: {mono_row: MR3, mono_col: MC7}}
            home: {mono_row: MR1, mono_col: MC4, mirror: {mono_row: MR4, mono_col: MC4}}
            bottom: {mono_row: MR2, mono_col: MC1, mirror: {mono_row: MR5, mono_col: MC1}}
        ring:
          key: {stagger: 5, column_net: C2, col_i: 2}
          rows:
            num: {mono_row: MR0, mono_col: MC2, mirror: {mono_row: MR3, mono_col: MC2}}
            top: {mono_row: MR0, mono_col: MC8, mirror: {mono_row: MR3, mono_col: MC8}}
            home: {mono_row: MR1, mono_col: MC5, mirror: {mono_row: MR4, mono_col: MC5}}
            bottom: {mono_row: MR2, mono_col: MC2, mirror: {mono_row: MR5, mono_col: MC2}}
        middle:
          key: {stagger: 3, column_net: C3, col_i: 3}
          rows:
            num: {mono_row: MR0, mono_col: MC3, mirror: {mono_row: MR3, mono_col: MC3}}
            top: {mono_row: MR1, mono_col: MC0, mirror: {mono_row: MR4, mono_col: MC0}}
            home: {mono_row: MR1, mono_col: MC6, mirror: {mono_row: MR4, mono_col: MC6}}
            bottom: {mono_row: MR2, mono_col: MC3, mirror: {mono_row: MR5, mono_col: MC3}}
        index:
          key: {stagger: -3, column_net: C4, col_i: 4}
          rows:
            num: {mono_row: MR0, mono_col: MC4, mirror: {mono_row: MR3, mono_col: MC4}}
            top: {mono_row: MR1, mono_col: MC1, mirror: {mono_row: MR4, mono_col: MC1}}
            home: {mono_row: MR1, mono_col: MC7, mirror: {mono_row: MR4, mono_col: MC7}}
            bottom: {mono_row: MR2, mono_col: MC4, mirror: {mono_row: MR5, mono_col: MC4}}
        inner:
          key: {stagger: -3, column_net: C5, col_i: 5}
          rows:
            num: {mono_row: MR0, mono_col: MC5, mirror: {mono_row: MR3, mono_col: MC5}}
            top: {mono_row: MR1, mono_col: MC2, mirror: {mono_row: MR4, mono_col: MC2}}
            home: {mono_row: MR1, mono_col: MC8, mirror: {mono_row: MR4, mono_col: MC8}}
            bottom: {mono_row: MR2, mono_col: MC5, mirror: {mono_row: MR5, mono_col: MC5}}
      rows:
        bottom: {row_net: R3, row_i: 3}
        home: {row_net: R2, row_i: 2}
        top: {row_net: R1, row_i: 1}
        num: {row_net: R0, row_i: 0}
    thumb:
      anchor:
        ref: matrix_index_bottom
        shift: [-3, -20]
      columns:
        tucky:
          key: {mono_row: MR2, mono_col: MC6, mirror: {mono_row: MR5, mono_col: MC6}, column_net: C3, col_i: 3}
        home:
          key: {mono_row: MR2, mono_col: MC7, mirror: {mono_row: MR5, mono_col: MC7}, splay: -6, origin: [-9.5, -9], column_net: C4, col_i: 4}
        reachy:
          key: {mono_row: MR2, mono_col: MC8, mirror: {mono_row: MR5, mono_col: MC8}, splay: -6, origin: [-9.5, -9], column_net: C5, col_i: 5}
      rows:
        one: {row_net: R4, row_i: 4}
  mirror:
    ref: matrix_inner_bottom
    distance: 71.8   # puts the mirror axis at x = cx (inner col at 95.25)
outlines:
  keycaps:   # 18 x 18 MX-size low-profile keycaps (for previews)
    - what: rectangle
      where: true
      size: [18, 18]
  # full outer envelope of the keyboard (matches stock keyboard)
  envelope:
    - what: rectangle
      size: [board_w, board_h]
      corner: 6
      adjust.shift: [cx, cy]
  # PCB of the monolithic board
  pcb_mono:
    - what: rectangle
      size: [board_w - 2*wall, board_h - 2*wall]
      corner: 3.5
      adjust.shift: [cx, cy]
  _left_clip:
    - what: rectangle
      size: [board_w/2, board_h + 10]
      adjust.shift: [cx - board_w/4 - join_wall, cy]
  _right_clip:
    - what: rectangle
      size: [board_w/2, board_h + 10]
      adjust.shift: [cx + board_w/4 + join_wall, cy]
  pcb_left:
    - pcb_mono
    - ~_left_clip
  pcb_right:
    - pcb_mono
    - ~_right_clip
  # envelope halves (case outer shape of each split half)
  _env_left_clip:
    - what: rectangle
      size: [board_w/2, board_h + 10]
      adjust.shift: [cx - board_w/4, cy]
  _env_right_clip:
    - what: rectangle
      size: [board_w/2, board_h + 10]
      adjust.shift: [cx + board_w/4, cy]
  envelope_left:
    - envelope
    - ~_env_left_clip
  envelope_right:
    - envelope
    - ~_env_right_clip
  # keycap clearance cutouts for the case top frame
  caps:
    - what: rectangle
      where: true
      size: [19, 19]
  preview_mono:
    - envelope
    - -caps
pcbs:
  left:
    template: kicad5
    outlines:
      edge:
        outline: pcb_left
        layer: Edge.Cuts
    footprints:
      choc:
        what: choc
        where: /^(matrix|thumb)_/
        params: {hotswap: false, keycaps: true, from: "{{colrow}}", to: "{{column_net}}"}
      diode:
        what: diode_tht
        where: /^(matrix|thumb)_/
        adjust: {shift: [0, -5.3]}
        params: {from: "{{colrow}}", to: "{{row_net}}"}
      mcu:
        what: promicro
        adjust: {shift: [115, 54], rotate: -90}
        params:
          P4: R0
          P5: R1
          P6: R2
          P7: R3
          P8: R4
          P21: C0
          P20: C1
          P19: C2
          P18: C3
          P15: C4
          P14: C5
          P1: CS
          P2: MOSI
          P3: SCK
      display:
        what: nice_view
        adjust: {shift: [115, 51.6]}
      power:
        what: slide_switch_tht
        adjust: {shift: [100, 71.0], rotate: 0}
        params: {from: BAT_P, to: RAW}
      battery:
        what: battery_pads
        adjust: {shift: [115, 27.5]}
        params: {pos: BAT_P, neg: GND}
      chg_link:
        what: charge_link
        adjust: {shift: [125.65, 29.5], rotate: 0}
        params: {a: LINK_B, b: GND, kind: male, tht: true}
      chg_fuse:
        what: tht2
        adjust: {shift: [121.15, 23.0], rotate: 90}
        params: {designator: F, from: BAT_P, to: LINK_F, pitch: 5.08, value: "PTC MF-R010 0.1A hold, radial, bent flat"}
      chg_res:
        what: tht2
        adjust: {shift: [121.15, 10.5], rotate: 90}
        params: {designator: R, from: LINK_F, to: LINK_B, pitch: 7.62, value: "10R 0.4W axial DIN0204"}
      reset:
        what: tht2
        adjust: {shift: [107, 27], rotate: 90}
        params: {designator: SW, from: RST, to: GND, pitch: 2.54, value: "reset pads (short or 2-pin tact)", label: RST}
      # Optional status LEDs instead of the nice!view (fit one or the other): 3 mm R/G/B LEDs on
      # the display pins, resistors on the bottom like the diodes. Driven by zmk-rgbled-widget.
      led_r:
        what: led_3mm
        adjust: {shift: [110, 31.3], rotate: 90}
        params: {A: LED_R, color: red}
      led_r_res:
        what: tht2
        adjust: {shift: [110, 19], rotate: 90}
        params: {designator: R, from: CS, to: LED_R, pitch: 7.62, value: "680R axial DIN0204, on the bottom"}
      led_g:
        what: led_3mm
        adjust: {shift: [113.8, 31.3], rotate: 90}
        params: {A: LED_G, color: green}
      led_g_res:
        what: tht2
        adjust: {shift: [113.8, 19], rotate: 90}
        params: {designator: R, from: MOSI, to: LED_G, pitch: 7.62, value: "150R axial DIN0204, on the bottom"}
      led_b:
        what: led_3mm
        adjust: {shift: [117.6, 31.3], rotate: 90}
        params: {A: LED_B, color: blue}
      led_b_res:
        what: tht2
        adjust: {shift: [117.6, 19], rotate: 90}
        params: {designator: R, from: SCK, to: LED_B, pitch: 7.62, value: "150R axial DIN0204, on the bottom"}
      h1: {what: mounting_hole, adjust.shift: [-11.5, 72]}
      h2: {what: mounting_hole, adjust.shift: [0, -25]}
      h3: {what: mounting_hole, adjust.shift: [40, -22]}
      h4: {what: mounting_hole, adjust.shift: [47.6, 73.6]}
      h5: {what: mounting_hole, adjust.shift: [123.4, 73.9]}
      h6: {what: mounting_hole, adjust.shift: [123.4, -27]}
  right:
    template: kicad5
    outlines:
      edge:
        outline: pcb_right
        layer: Edge.Cuts
    footprints:
      choc:
        what: choc
        where: /^mirror_/
        params: {hotswap: false, keycaps: true, from: "{{colrow}}", to: "{{column_net}}"}
      diode:
        what: diode_tht
        where: /^mirror_/
        adjust: {shift: [0, -5.3]}
        params: {from: "{{colrow}}", to: "{{row_net}}"}
      mcu:
        what: promicro
        adjust: {shift: [147.3, 54], rotate: -90}
        params:
          P4: R0
          P5: R1
          P6: R2
          P7: R3
          P8: R4
          P21: C0
          P20: C1
          P19: C2
          P18: C3
          P15: C4
          P14: C5
          P1: CS
          P2: MOSI
          P3: SCK
      display:
        what: nice_view
        adjust: {shift: [147.3, 51.6]}
      power:
        what: slide_switch_tht
        adjust: {shift: [162.3, 71.0], rotate: 0}
        params: {from: BAT_P, to: RAW}
      battery:
        what: battery_pads
        adjust: {shift: [147.3, 27.5]}
        params: {pos: BAT_P, neg: GND}
      chg_link:
        what: charge_link
        adjust: {shift: [136.65, 29.5], rotate: 180}
        params: {a: GND, b: LINK_B, kind: female, tht: true}
      chg_fuse:
        what: tht2
        adjust: {shift: [141.15, 23.0], rotate: 90}
        params: {designator: F, from: BAT_P, to: LINK_F, pitch: 5.08, value: "PTC MF-R010 0.1A hold, radial, bent flat"}
      chg_res:
        what: tht2
        adjust: {shift: [141.15, 10.5], rotate: 90}
        params: {designator: R, from: LINK_F, to: LINK_B, pitch: 7.62, value: "10R 0.4W axial DIN0204"}
      reset:
        what: tht2
        adjust: {shift: [155.3, 27], rotate: 90}
        params: {designator: SW, from: RST, to: GND, pitch: 2.54, value: "reset pads (short or 2-pin tact)", label: RST}
      # Optional status LEDs instead of the nice!view (fit one or the other): 3 mm R/G/B LEDs on
      # the display pins, resistors on the bottom like the diodes. Driven by zmk-rgbled-widget.
      led_r:
        what: led_3mm
        adjust: {shift: [152.3, 31.3], rotate: 90}
        params: {A: LED_R, color: red}
      led_r_res:
        what: tht2
        adjust: {shift: [152.3, 19], rotate: 90}
        params: {designator: R, from: CS, to: LED_R, pitch: 7.62, value: "680R axial DIN0204, on the bottom"}
      led_g:
        what: led_3mm
        adjust: {shift: [148.5, 31.3], rotate: 90}
        params: {A: LED_G, color: green}
      led_g_res:
        what: tht2
        adjust: {shift: [148.5, 19], rotate: 90}
        params: {designator: R, from: MOSI, to: LED_G, pitch: 7.62, value: "150R axial DIN0204, on the bottom"}
      led_b:
        what: led_3mm
        adjust: {shift: [144.7, 31.3], rotate: 90}
        params: {A: LED_B, color: blue}
      led_b_res:
        what: tht2
        adjust: {shift: [144.7, 19], rotate: 90}
        params: {designator: R, from: SCK, to: LED_B, pitch: 7.62, value: "150R axial DIN0204, on the bottom"}
      h1: {what: mounting_hole, adjust.shift: [273.8, 72]}
      h2: {what: mounting_hole, adjust.shift: [262.3, -25]}
      h3: {what: mounting_hole, adjust.shift: [222.3, -22]}
      h4: {what: mounting_hole, adjust.shift: [214.7, 73.6]}
      h5: {what: mounting_hole, adjust.shift: [138.9, 73.9]}
      h6: {what: mounting_hole, adjust.shift: [138.9, -27]}
  mono:
    template: kicad5
    outlines:
      edge:
        outline: pcb_mono
        layer: Edge.Cuts
    footprints:
      choc:
        what: choc
        where: /^(matrix|thumb|mirror)_/
        params: {hotswap: false, keycaps: true, from: "{{colrow}}", to: "{{mono_col}}"}
      diode:
        what: diode_tht
        where: /^(matrix|thumb|mirror)_/
        adjust: {shift: [0, -5.3]}
        params: {from: "{{colrow}}", to: "{{mono_row}}"}
      mcu:
        what: promicro
        adjust: {shift: [131.15, 54], rotate: -90}
        params:
          P4: MR0
          P5: MR1
          P6: MR2
          P7: MR3
          P8: MR4
          P9: MR5
          P21: MC0
          P20: MC1
          P19: MC2
          P18: MC3
          P15: MC4
          P14: MC5
          P16: MC6
          P10: MC7
          P0: MC8
          P1: CS
          P2: MOSI
          P3: SCK
      display:
        what: nice_view
        adjust: {shift: [131.15, 51.6]}
      power:
        what: slide_switch_tht
        adjust: {shift: [115, 71.0], rotate: 0}
        params: {from: BAT_P, to: RAW}
      battery:
        what: battery_pads
        adjust: {shift: [131.15, 27.5]}
        params: {pos: BAT_P, neg: GND}
      reset:
        what: tht2
        adjust: {shift: [118, 30], rotate: 90}
        params: {designator: SW, from: RST, to: GND, pitch: 2.54, value: "reset pads (short or 2-pin tact)", label: RST}
      # Optional status LEDs instead of the nice!view (fit one or the other): 3 mm R/G/B LEDs on
      # the display pins, resistors on the bottom like the diodes. Driven by zmk-rgbled-widget.
      led_r:
        what: led_3mm
        adjust: {shift: [127.35, 31.3], rotate: 90}
        params: {A: LED_R, color: red}
      led_r_res:
        what: tht2
        adjust: {shift: [127.35, 19], rotate: 90}
        params: {designator: R, from: CS, to: LED_R, pitch: 7.62, value: "680R axial DIN0204, on the bottom"}
      led_g:
        what: led_3mm
        adjust: {shift: [131.15, 31.3], rotate: 90}
        params: {A: LED_G, color: green}
      led_g_res:
        what: tht2
        adjust: {shift: [131.15, 19], rotate: 90}
        params: {designator: R, from: MOSI, to: LED_G, pitch: 7.62, value: "150R axial DIN0204, on the bottom"}
      led_b:
        what: led_3mm
        adjust: {shift: [134.95, 31.3], rotate: 90}
        params: {A: LED_B, color: blue}
      led_b_res:
        what: tht2
        adjust: {shift: [134.95, 19], rotate: 90}
        params: {designator: R, from: SCK, to: LED_B, pitch: 7.62, value: "150R axial DIN0204, on the bottom"}
      h1: {what: mounting_hole, adjust.shift: [-11.5, 72]}
      h2: {what: mounting_hole, adjust.shift: [0, -25]}
      h3: {what: mounting_hole, adjust.shift: [40, -22]}
      h4: {what: mounting_hole, adjust.shift: [47.6, 73.6]}
      h5: {what: mounting_hole, adjust.shift: [123.4, 73.9]}
      h6: {what: mounting_hole, adjust.shift: [123.4, -27]}
      h7: {what: mounting_hole, adjust.shift: [273.8, 72]}
      h8: {what: mounting_hole, adjust.shift: [262.3, -25]}
      h9: {what: mounting_hole, adjust.shift: [222.3, -22]}
      h10: {what: mounting_hole, adjust.shift: [214.7, 73.6]}
      h11: {what: mounting_hole, adjust.shift: [138.9, 73.9]}
      h12: {what: mounting_hole, adjust.shift: [138.9, -27]}
