# Yoga Book 9i Gen 9 low-profile split keyboard, 3-ROW variant (generated by tools/make_3row.py:
# edit ergogen/config.yaml or the script, not this file). Key blocks rotated 10 deg inward.
# One ergogen config produces three PCBs: split left, split right, and monolithic.
# Coordinates in mm. Board envelope = stock keyboard footprint 295.3 x 113 mm.
meta:
  engine: 4.2.1
  name: yoga-split-3row
  version: 0.1
  author: BlaiseRideout
units:
  kx: 18          # Choc keycap spacing (horizontal)
  ky: 17          # Choc keycap spacing (vertical)
  board_w: 295.3  # stock keyboard width
  board_h: 113    # stock keyboard depth
  cx: 131         # board centre x (split line)
  cy: 18.6        # board centre y
  wall: 2.5       # case wall + clearance -> PCB inset
  join_wall: 5.5  # thicker inner wall on split halves (holds joining magnets)
points:
  key:
    width: 17.5
    height: 16.5
    spread: kx
    padding: ky
    tags: [key]
  zones:
    matrix:
      anchor: {shift: [-3, 17], rotate: -10}
      columns:
        outer:
          key: {stagger: 0, column_net: C0, col_i: 0}
          rows:
            top: {mono_row: MR0, mono_col: MC0, mirror: {mono_row: MR3, mono_col: MC0}}
            home: {mono_row: MR1, mono_col: MC0, mirror: {mono_row: MR4, mono_col: MC0}}
            bottom: {mono_row: MR2, mono_col: MC0, mirror: {mono_row: MR5, mono_col: MC0}}
        pinky:
          key: {stagger: 0, column_net: C1, col_i: 1}
          rows:
            top: {mono_row: MR0, mono_col: MC1, mirror: {mono_row: MR3, mono_col: MC1}}
            home: {mono_row: MR1, mono_col: MC1, mirror: {mono_row: MR4, mono_col: MC1}}
            bottom: {mono_row: MR2, mono_col: MC1, mirror: {mono_row: MR5, mono_col: MC1}}
        ring:
          key: {stagger: 6, column_net: C2, col_i: 2}
          rows:
            top: {mono_row: MR0, mono_col: MC2, mirror: {mono_row: MR3, mono_col: MC2}}
            home: {mono_row: MR1, mono_col: MC2, mirror: {mono_row: MR4, mono_col: MC2}}
            bottom: {mono_row: MR2, mono_col: MC2, mirror: {mono_row: MR5, mono_col: MC2}}
        middle:
          key: {stagger: 3, column_net: C3, col_i: 3}
          rows:
            top: {mono_row: MR0, mono_col: MC3, mirror: {mono_row: MR3, mono_col: MC3}}
            home: {mono_row: MR1, mono_col: MC3, mirror: {mono_row: MR4, mono_col: MC3}}
            bottom: {mono_row: MR2, mono_col: MC3, mirror: {mono_row: MR5, mono_col: MC3}}
        index:
          key: {stagger: -3, column_net: C4, col_i: 4}
          rows:
            top: {mono_row: MR0, mono_col: MC4, mirror: {mono_row: MR3, mono_col: MC4}}
            home: {mono_row: MR1, mono_col: MC4, mirror: {mono_row: MR4, mono_col: MC4}}
            bottom: {mono_row: MR2, mono_col: MC4, mirror: {mono_row: MR5, mono_col: MC4}}
        inner:
          key: {stagger: -3, column_net: C5, col_i: 5}
          rows:
            top: {mono_row: MR0, mono_col: MC5, mirror: {mono_row: MR3, mono_col: MC5}}
            home: {mono_row: MR1, mono_col: MC5, mirror: {mono_row: MR4, mono_col: MC5}}
            bottom: {mono_row: MR2, mono_col: MC5, mirror: {mono_row: MR5, mono_col: MC5}}
      rows:
        bottom: {row_net: R2, row_i: 2}
        home: {row_net: R1, row_i: 1}
        top: {row_net: R0, row_i: 0}
    thumb:
      anchor:
        ref: matrix_index_bottom
        shift: [-4, -19.5]
      columns:
        tucky:
          key: {mono_row: MR0, mono_col: MC6, mirror: {mono_row: MR3, mono_col: MC6}, column_net: C3, col_i: 3}
        home:
          key: {mono_row: MR1, mono_col: MC6, mirror: {mono_row: MR4, mono_col: MC6}, splay: -10, origin: [-9, -8.5], column_net: C4, col_i: 4}
        reachy:
          key: {mono_row: MR2, mono_col: MC6, mirror: {mono_row: MR5, mono_col: MC6}, splay: -10, origin: [-9, -8.5], shift: [0, 4.25], height: 25, column_net: C5, col_i: 5}
      rows:
        one: {row_net: R3, row_i: 3}
  mirror:
    ref: matrix_inner_bottom
    distance: 89.693   # puts the mirror axis at x = cx
outlines:
  keycaps:   # 17.5 x 16.5 Choc keycap footprints (for previews)
    - what: rectangle
      where: /^(?!(mirror_)?thumb_reachy)/
      size: [17.5, 16.5]
    - what: rectangle
      where: /^(mirror_)?thumb_reachy/
      size: [17.5, 25.0]
  # full outer envelope of the keyboard (matches stock keyboard)
  envelope:
    - what: rectangle
      size: [board_w, board_h]
      corner: 6
      adjust.shift: [cx, cy]
  # PCB of the monolithic board
  pcb_mono:
    - what: rectangle
      size: [board_w - 2*wall, board_h - 2*wall]
      corner: 3.5
      adjust.shift: [cx, cy]
  _left_clip:
    - what: rectangle
      size: [board_w/2, board_h + 10]
      adjust.shift: [cx - board_w/4 - join_wall, cy]
  _right_clip:
    - what: rectangle
      size: [board_w/2, board_h + 10]
      adjust.shift: [cx + board_w/4 + join_wall, cy]
  pcb_left:
    - pcb_mono
    - ~_left_clip
  pcb_right:
    - pcb_mono
    - ~_right_clip
  # envelope halves (case outer shape of each split half)
  _env_left_clip:
    - what: rectangle
      size: [board_w/2, board_h + 10]
      adjust.shift: [cx - board_w/4, cy]
  _env_right_clip:
    - what: rectangle
      size: [board_w/2, board_h + 10]
      adjust.shift: [cx + board_w/4, cy]
  envelope_left:
    - envelope
    - ~_env_left_clip
  envelope_right:
    - envelope
    - ~_env_right_clip
  # keycap clearance cutouts for the case top frame
  caps:
    - what: rectangle
      where: /^(?!(mirror_)?thumb_reachy)/
      size: [18.5, 17.5]
    - what: rectangle
      where: /^(mirror_)?thumb_reachy/
      size: [18.5, 26.0]
  preview_mono:
    - envelope
    - -caps
pcbs:
  left:
    template: kicad5
    outlines:
      edge:
        outline: pcb_left
        layer: Edge.Cuts
    footprints:
      choc:
        what: choc
        where: /^(matrix|thumb)_(?!reachy)/
        params: {hotswap: false, keycaps: true, from: "{{colrow}}", to: "{{column_net}}"}
      choc_tall:
        what: choc
        where: /^thumb_reachy/
        adjust: {rotate: 90}
        params: {hotswap: false, keycaps: false, from: "{{colrow}}", to: "{{column_net}}"}
      diode:
        what: diode_tht
        where: /^(matrix|thumb)_/
        adjust: {shift: [0, -5.3]}
        params: {from: "{{colrow}}", to: "{{row_net}}"}
      mcu:
        what: promicro
        adjust: {shift: [113, 52], rotate: -90}
        params:
          P4: R0
          P5: R1
          P6: R2
          P7: R3
          P21: C0
          P20: C1
          P19: C2
          P18: C3
          P15: C4
          P14: C5
          P1: CS
          P2: MOSI
          P3: SCK
      display:
        what: nice_view
        adjust: {shift: [113, 49.6]}
      power:
        what: slide_switch_tht
        adjust: {shift: [93, 67.4], rotate: 0}
        params: {from: BAT_P, to: RAW}
      battery:
        what: battery_pads
        adjust: {shift: [116, 25.5]}
        params: {pos: BAT_P, neg: GND}
      chg_link:
        what: charge_link
        adjust: {shift: [125.5, 28], rotate: 0}
        params: {a: LINK_B, b: GND, kind: male, tht: true}
      chg_fuse:
        what: tht2
        adjust: {shift: [121.0, 21.5], rotate: 90}
        params: {designator: F, from: BAT_P, to: LINK_F, pitch: 5.08, value: "PTC MF-R010 0.1A hold, radial, bent flat"}
      chg_res:
        what: tht2
        adjust: {shift: [121.0, 9], rotate: 90}
        params: {designator: R, from: LINK_F, to: LINK_B, pitch: 7.62, value: "10R 0.4W axial DIN0204"}
      reset:
        what: tht2
        adjust: {shift: [104, 28], rotate: 90}
        params: {designator: SW, from: RST, to: GND, pitch: 2.54, value: "reset pads (short or 2-pin tact)", label: RST}
      # Optional status LEDs instead of the nice!view (fit one or the other): 3 mm R/G/B LEDs on
      # the display pins, resistors on the bottom like the diodes. Driven by zmk-rgbled-widget.
      led_r:
        what: led_3mm
        adjust: {shift: [108.2, 29.2], rotate: 90}
        params: {A: LED_R, color: red}
      led_r_res:
        what: tht2
        adjust: {shift: [108.2, 17], rotate: 90}
        params: {designator: R, from: CS, to: LED_R, pitch: 7.62, value: "680R axial DIN0204, on the bottom"}
      led_g:
        what: led_3mm
        adjust: {shift: [112, 29.2], rotate: 90}
        params: {A: LED_G, color: green}
      led_g_res:
        what: tht2
        adjust: {shift: [112, 17], rotate: 90}
        params: {designator: R, from: MOSI, to: LED_G, pitch: 7.62, value: "150R axial DIN0204, on the bottom"}
      led_b:
        what: led_3mm
        adjust: {shift: [115.8, 29.2], rotate: 90}
        params: {A: LED_B, color: blue}
      led_b_res:
        what: tht2
        adjust: {shift: [115.8, 17], rotate: 90}
        params: {designator: R, from: SCK, to: LED_B, pitch: 7.62, value: "150R axial DIN0204, on the bottom"}
      h1: {what: mounting_hole, adjust.shift: [-8, 66]}
      h2: {what: mounting_hole, adjust.shift: [-8, -28]}
      h3: {what: mounting_hole, adjust.shift: [40, -24]}
      h4: {what: mounting_hole, adjust.shift: [47.5, 69]}
      h5: {what: mounting_hole, adjust.shift: [101.3, 68]}
      h6: {what: mounting_hole, adjust.shift: [122.5, -30]}
  right:
    template: kicad5
    outlines:
      edge:
        outline: pcb_right
        layer: Edge.Cuts
    footprints:
      choc:
        what: choc
        where: /^mirror_(?!thumb_reachy)/
        params: {hotswap: false, keycaps: true, from: "{{colrow}}", to: "{{column_net}}"}
      choc_tall:
        what: choc
        where: /^mirror_thumb_reachy/
        adjust: {rotate: -90}
        params: {hotswap: false, keycaps: false, from: "{{colrow}}", to: "{{column_net}}"}
      diode:
        what: diode_tht
        where: /^mirror_/
        adjust: {shift: [0, -5.3]}
        params: {from: "{{colrow}}", to: "{{row_net}}"}
      mcu:
        what: promicro
        adjust: {shift: [149, 52], rotate: -90}
        params:
          P4: R0
          P5: R1
          P6: R2
          P7: R3
          P21: C0
          P20: C1
          P19: C2
          P18: C3
          P15: C4
          P14: C5
          P1: CS
          P2: MOSI
          P3: SCK
      display:
        what: nice_view
        adjust: {shift: [149, 49.6]}
      power:
        what: slide_switch_tht
        adjust: {shift: [169, 67.4], rotate: 0}
        params: {from: BAT_P, to: RAW}
      battery:
        what: battery_pads
        adjust: {shift: [146, 25.5]}
        params: {pos: BAT_P, neg: GND}
      chg_link:
        what: charge_link
        adjust: {shift: [136.5, 28], rotate: 180}
        params: {a: GND, b: LINK_B, kind: female, tht: true}
      chg_fuse:
        what: tht2
        adjust: {shift: [141.0, 21.5], rotate: 90}
        params: {designator: F, from: BAT_P, to: LINK_F, pitch: 5.08, value: "PTC MF-R010 0.1A hold, radial, bent flat"}
      chg_res:
        what: tht2
        adjust: {shift: [141.0, 9], rotate: 90}
        params: {designator: R, from: LINK_F, to: LINK_B, pitch: 7.62, value: "10R 0.4W axial DIN0204"}
      reset:
        what: tht2
        adjust: {shift: [158, 28], rotate: 90}
        params: {designator: SW, from: RST, to: GND, pitch: 2.54, value: "reset pads (short or 2-pin tact)", label: RST}
      # Optional status LEDs instead of the nice!view (fit one or the other): 3 mm R/G/B LEDs on
      # the display pins, resistors on the bottom like the diodes. Driven by zmk-rgbled-widget.
      led_r:
        what: led_3mm
        adjust: {shift: [153.8, 29.2], rotate: 90}
        params: {A: LED_R, color: red}
      led_r_res:
        what: tht2
        adjust: {shift: [153.8, 17], rotate: 90}
        params: {designator: R, from: CS, to: LED_R, pitch: 7.62, value: "680R axial DIN0204, on the bottom"}
      led_g:
        what: led_3mm
        adjust: {shift: [150, 29.2], rotate: 90}
        params: {A: LED_G, color: green}
      led_g_res:
        what: tht2
        adjust: {shift: [150, 17], rotate: 90}
        params: {designator: R, from: MOSI, to: LED_G, pitch: 7.62, value: "150R axial DIN0204, on the bottom"}
      led_b:
        what: led_3mm
        adjust: {shift: [146.2, 29.2], rotate: 90}
        params: {A: LED_B, color: blue}
      led_b_res:
        what: tht2
        adjust: {shift: [146.2, 17], rotate: 90}
        params: {designator: R, from: SCK, to: LED_B, pitch: 7.62, value: "150R axial DIN0204, on the bottom"}
      h1: {what: mounting_hole, adjust.shift: [270, 66]}
      h2: {what: mounting_hole, adjust.shift: [270, -28]}
      h3: {what: mounting_hole, adjust.shift: [222, -24]}
      h4: {what: mounting_hole, adjust.shift: [214.5, 69]}
      h5: {what: mounting_hole, adjust.shift: [160.7, 68]}
      h6: {what: mounting_hole, adjust.shift: [139.5, -30]}
  mono:
    template: kicad5
    outlines:
      edge:
        outline: pcb_mono
        layer: Edge.Cuts
    footprints:
      choc:
        what: choc
        where: /^(?!(mirror_)?thumb_reachy)(matrix|thumb|mirror)_/
        params: {hotswap: false, keycaps: true, from: "{{colrow}}", to: "{{mono_col}}"}
      choc_tall:
        what: choc
        where: /^thumb_reachy/
        adjust: {rotate: 90}
        params: {hotswap: false, keycaps: false, from: "{{colrow}}", to: "{{mono_col}}"}
      choc_tall1:
        what: choc
        where: /^mirror_thumb_reachy/
        adjust: {rotate: -90}
        params: {hotswap: false, keycaps: false, from: "{{colrow}}", to: "{{mono_col}}"}
      diode:
        what: diode_tht
        where: /^(matrix|thumb|mirror)_/
        adjust: {shift: [0, -5.3]}
        params: {from: "{{colrow}}", to: "{{mono_row}}"}
      mcu:
        what: promicro
        adjust: {shift: [131, 52], rotate: -90}
        params:
          P4: MR0
          P5: MR1
          P6: MR2
          P7: MR3
          P8: MR4
          P9: MR5
          P21: MC0
          P20: MC1
          P19: MC2
          P18: MC3
          P15: MC4
          P14: MC5
          P16: MC6
          P1: CS
          P2: MOSI
          P3: SCK
      display:
        what: nice_view
        adjust: {shift: [131, 49.6]}
      power:
        what: slide_switch_tht
        adjust: {shift: [114, 67.4], rotate: 0}
        params: {from: BAT_P, to: RAW}
      battery:
        what: battery_pads
        adjust: {shift: [131, 25.5]}
        params: {pos: BAT_P, neg: GND}
      reset:
        what: tht2
        adjust: {shift: [118, 28], rotate: 90}
        params: {designator: SW, from: RST, to: GND, pitch: 2.54, value: "reset pads (short or 2-pin tact)", label: RST}
      # Optional status LEDs instead of the nice!view (fit one or the other): 3 mm R/G/B LEDs on
      # the display pins, resistors on the bottom like the diodes. Driven by zmk-rgbled-widget.
      led_r:
        what: led_3mm
        adjust: {shift: [127.2, 29.2], rotate: 90}
        params: {A: LED_R, color: red}
      led_r_res:
        what: tht2
        adjust: {shift: [127.2, 17], rotate: 90}
        params: {designator: R, from: CS, to: LED_R, pitch: 7.62, value: "680R axial DIN0204, on the bottom"}
      led_g:
        what: led_3mm
        adjust: {shift: [131, 29.2], rotate: 90}
        params: {A: LED_G, color: green}
      led_g_res:
        what: tht2
        adjust: {shift: [131, 17], rotate: 90}
        params: {designator: R, from: MOSI, to: LED_G, pitch: 7.62, value: "150R axial DIN0204, on the bottom"}
      led_b:
        what: led_3mm
        adjust: {shift: [134.8, 29.2], rotate: 90}
        params: {A: LED_B, color: blue}
      led_b_res:
        what: tht2
        adjust: {shift: [134.8, 17], rotate: 90}
        params: {designator: R, from: SCK, to: LED_B, pitch: 7.62, value: "150R axial DIN0204, on the bottom"}
      h1: {what: mounting_hole, adjust.shift: [-8, 66]}
      h2: {what: mounting_hole, adjust.shift: [-8, -28]}
      h3: {what: mounting_hole, adjust.shift: [40, -24]}
      h4: {what: mounting_hole, adjust.shift: [47.5, 69]}
      h5: {what: mounting_hole, adjust.shift: [101.3, 68]}
      h6: {what: mounting_hole, adjust.shift: [122.5, -30]}
      h7: {what: mounting_hole, adjust.shift: [270, 66]}
      h8: {what: mounting_hole, adjust.shift: [270, -28]}
      h9: {what: mounting_hole, adjust.shift: [222, -24]}
      h10: {what: mounting_hole, adjust.shift: [214.5, 69]}
      h11: {what: mounting_hole, adjust.shift: [160.7, 68]}
      h12: {what: mounting_hole, adjust.shift: [139.5, -30]}
