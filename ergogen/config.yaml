# Yoga Book 9i Gen 9 low-profile split keyboard
# One ergogen config produces three PCBs: split left, split right, and monolithic.
# Coordinates in mm. Board envelope = stock keyboard footprint 295.3 x 113 mm.
meta:
  engine: 4.2.1
  name: yoga-split
  version: 0.1
  author: BlaiseRideout
units:
  kx: 18          # Choc keycap spacing (horizontal)
  ky: 17          # Choc keycap spacing (vertical)
  board_w: 295.3  # stock keyboard width
  board_h: 113    # stock keyboard depth
  cx: 131         # board centre x (split line)
  cy: 18.6        # board centre y
  wall: 2.5       # case wall + clearance -> PCB inset
  join_wall: 5.5  # thicker inner wall on split halves (holds joining magnets)
points:
  key:
    width: 17.5
    height: 16.5
    spread: kx
    padding: ky
    tags: [key]
  zones:
    matrix:
      columns:
        outer:
          key: {stagger: 0, column_net: C0, col_i: 0}
          rows:
            num: {mono_row: MR0, mono_col: MC0, mirror: {mono_row: MR3, mono_col: MC0}}
            top: {mono_row: MR0, mono_col: MC6, mirror: {mono_row: MR3, mono_col: MC6}}
            home: {mono_row: MR1, mono_col: MC3, mirror: {mono_row: MR4, mono_col: MC3}}
            bottom: {mono_row: MR2, mono_col: MC0, mirror: {mono_row: MR5, mono_col: MC0}}
        pinky:
          key: {stagger: 0, column_net: C1, col_i: 1}
          rows:
            num: {mono_row: MR0, mono_col: MC1, mirror: {mono_row: MR3, mono_col: MC1}}
            top: {mono_row: MR0, mono_col: MC7, mirror: {mono_row: MR3, mono_col: MC7}}
            home: {mono_row: MR1, mono_col: MC4, mirror: {mono_row: MR4, mono_col: MC4}}
            bottom: {mono_row: MR2, mono_col: MC1, mirror: {mono_row: MR5, mono_col: MC1}}
        ring:
          key: {stagger: 6, column_net: C2, col_i: 2}
          rows:
            num: {mono_row: MR0, mono_col: MC2, mirror: {mono_row: MR3, mono_col: MC2}}
            top: {mono_row: MR0, mono_col: MC8, mirror: {mono_row: MR3, mono_col: MC8}}
            home: {mono_row: MR1, mono_col: MC5, mirror: {mono_row: MR4, mono_col: MC5}}
            bottom: {mono_row: MR2, mono_col: MC2, mirror: {mono_row: MR5, mono_col: MC2}}
        middle:
          key: {stagger: 3, column_net: C3, col_i: 3}
          rows:
            num: {mono_row: MR0, mono_col: MC3, mirror: {mono_row: MR3, mono_col: MC3}}
            top: {mono_row: MR1, mono_col: MC0, mirror: {mono_row: MR4, mono_col: MC0}}
            home: {mono_row: MR1, mono_col: MC6, mirror: {mono_row: MR4, mono_col: MC6}}
            bottom: {mono_row: MR2, mono_col: MC3, mirror: {mono_row: MR5, mono_col: MC3}}
        index:
          key: {stagger: -3, column_net: C4, col_i: 4}
          rows:
            num: {mono_row: MR0, mono_col: MC4, mirror: {mono_row: MR3, mono_col: MC4}}
            top: {mono_row: MR1, mono_col: MC1, mirror: {mono_row: MR4, mono_col: MC1}}
            home: {mono_row: MR1, mono_col: MC7, mirror: {mono_row: MR4, mono_col: MC7}}
            bottom: {mono_row: MR2, mono_col: MC4, mirror: {mono_row: MR5, mono_col: MC4}}
        inner:
          key: {stagger: -3, column_net: C5, col_i: 5}
          rows:
            num: {mono_row: MR0, mono_col: MC5, mirror: {mono_row: MR3, mono_col: MC5}}
            top: {mono_row: MR1, mono_col: MC2, mirror: {mono_row: MR4, mono_col: MC2}}
            home: {mono_row: MR1, mono_col: MC8, mirror: {mono_row: MR4, mono_col: MC8}}
            bottom: {mono_row: MR2, mono_col: MC5, mirror: {mono_row: MR5, mono_col: MC5}}
      rows:
        bottom: {row_net: R3, row_i: 3}
        home: {row_net: R2, row_i: 2}
        top: {row_net: R1, row_i: 1}
        num: {row_net: R0, row_i: 0}
    thumb:
      anchor:
        ref: matrix_index_bottom
        shift: [-4, -19.5]
      columns:
        tucky:
          key: {mono_row: MR2, mono_col: MC6, mirror: {mono_row: MR5, mono_col: MC6}, column_net: C3, col_i: 3}
        home:
          key: {mono_row: MR2, mono_col: MC7, mirror: {mono_row: MR5, mono_col: MC7}, splay: -10, origin: [-9, -8.5], column_net: C4, col_i: 4}
        reachy:
          key: {mono_row: MR2, mono_col: MC8, mirror: {mono_row: MR5, mono_col: MC8}, splay: -10, origin: [-9, -8.5], column_net: C5, col_i: 5}
      rows:
        one: {row_net: R4, row_i: 4}
  mirror:
    ref: matrix_inner_bottom
    distance: 82   # puts the mirror axis at x = cx
outlines:
  keycaps:   # 17.5 x 16.5 Choc keycap footprints (for previews)
    - what: rectangle
      where: true
      size: [17.5, 16.5]
  # full outer envelope of the keyboard (matches stock keyboard)
  envelope:
    - what: rectangle
      size: [board_w, board_h]
      corner: 6
      adjust.shift: [cx, cy]
  # PCB of the monolithic board
  pcb_mono:
    - what: rectangle
      size: [board_w - 2*wall, board_h - 2*wall]
      corner: 3.5
      adjust.shift: [cx, cy]
  _left_clip:
    - what: rectangle
      size: [board_w/2, board_h + 10]
      adjust.shift: [cx - board_w/4 - join_wall, cy]
  _right_clip:
    - what: rectangle
      size: [board_w/2, board_h + 10]
      adjust.shift: [cx + board_w/4 + join_wall, cy]
  pcb_left:
    - pcb_mono
    - ~_left_clip
  pcb_right:
    - pcb_mono
    - ~_right_clip
  # envelope halves (case outer shape of each split half)
  _env_left_clip:
    - what: rectangle
      size: [board_w/2, board_h + 10]
      adjust.shift: [cx - board_w/4, cy]
  _env_right_clip:
    - what: rectangle
      size: [board_w/2, board_h + 10]
      adjust.shift: [cx + board_w/4, cy]
  envelope_left:
    - envelope
    - ~_env_left_clip
  envelope_right:
    - envelope
    - ~_env_right_clip
  # keycap clearance cutouts for the case top frame
  caps:
    - what: rectangle
      where: true
      size: [18.5, 17.5]
  preview_mono:
    - envelope
    - -caps
pcbs:
  left:
    template: kicad5
    outlines:
      edge:
        outline: pcb_left
        layer: Edge.Cuts
    footprints:
      choc:
        what: choc
        where: /^(matrix|thumb)_/
        params: {hotswap: true, keycaps: true, from: "{{colrow}}", to: "{{column_net}}"}
      diode:
        what: diode_sod123
        where: /^(matrix|thumb)_/
        adjust: {shift: [0, -5.3]}
        params: {from: "{{colrow}}", to: "{{row_net}}"}
      mcu:
        what: promicro
        adjust: {shift: [113, 52], rotate: -90}
        params:
          P4: R0
          P5: R1
          P6: R2
          P7: R3
          P8: R4
          P21: C0
          P20: C1
          P19: C2
          P18: C3
          P15: C4
          P14: C5
          P1: CS
          P2: MOSI
          P3: SCK
      display:
        what: nice_view
        adjust: {shift: [113, 49.6]}
      power:
        what: power_switch
        adjust: {shift: [93, 68], rotate: 0}
        params: {from: BAT_P, to: RAW}
      battery:
        what: battery_pads
        adjust: {shift: [116, 25.5]}
        params: {pos: BAT_P, neg: GND}
      chg_link:
        what: charge_link
        adjust: {shift: [125.5, 28], rotate: 0}
        params: {a: LINK_B, b: GND, kind: male}
      chg_fuse:
        what: smd_1206
        adjust: {shift: [121, 20], rotate: 90}
        params: {designator: F, side: B, from: BAT_P, to: LINK_F, value: "PTC 0.1A hold 1206"}
      chg_res:
        what: smd_1206
        adjust: {shift: [121, 15], rotate: 90}
        params: {designator: R, side: B, from: LINK_F, to: LINK_B, value: "10R 1206 0.25W"}
      reset:
        what: button
        adjust: {shift: [104, 28], rotate: 90}
        params: {side: F, from: RST, to: GND}
      h1: {what: mounting_hole, adjust.shift: [-8, 66]}
      h2: {what: mounting_hole, adjust.shift: [-8, -28]}
      h3: {what: mounting_hole, adjust.shift: [40, -24]}
      h4: {what: mounting_hole, adjust.shift: [47.5, 69]}
      h5: {what: mounting_hole, adjust.shift: [101.3, 68]}
      h6: {what: mounting_hole, adjust.shift: [122.5, -30]}
  right:
    template: kicad5
    outlines:
      edge:
        outline: pcb_right
        layer: Edge.Cuts
    footprints:
      choc:
        what: choc
        where: /^mirror_/
        params: {hotswap: true, keycaps: true, from: "{{colrow}}", to: "{{column_net}}"}
      diode:
        what: diode_sod123
        where: /^mirror_/
        adjust: {shift: [0, -5.3]}
        params: {from: "{{colrow}}", to: "{{row_net}}"}
      mcu:
        what: promicro
        adjust: {shift: [149, 52], rotate: -90}
        params:
          P4: R0
          P5: R1
          P6: R2
          P7: R3
          P8: R4
          P21: C0
          P20: C1
          P19: C2
          P18: C3
          P15: C4
          P14: C5
          P1: CS
          P2: MOSI
          P3: SCK
      display:
        what: nice_view
        adjust: {shift: [149, 49.6]}
      power:
        what: power_switch
        adjust: {shift: [169, 68], rotate: 0}
        params: {from: BAT_P, to: RAW}
      battery:
        what: battery_pads
        adjust: {shift: [146, 25.5]}
        params: {pos: BAT_P, neg: GND}
      chg_link:
        what: charge_link
        adjust: {shift: [136.5, 28], rotate: 180}
        params: {a: GND, b: LINK_B, kind: female}
      chg_fuse:
        what: smd_1206
        adjust: {shift: [141, 20], rotate: 90}
        params: {designator: F, side: B, from: BAT_P, to: LINK_F, value: "PTC 0.1A hold 1206"}
      chg_res:
        what: smd_1206
        adjust: {shift: [141, 15], rotate: 90}
        params: {designator: R, side: B, from: LINK_F, to: LINK_B, value: "10R 1206 0.25W"}
      reset:
        what: button
        adjust: {shift: [158, 28], rotate: 90}
        params: {side: F, from: RST, to: GND}
      h1: {what: mounting_hole, adjust.shift: [270, 66]}
      h2: {what: mounting_hole, adjust.shift: [270, -28]}
      h3: {what: mounting_hole, adjust.shift: [222, -24]}
      h4: {what: mounting_hole, adjust.shift: [214.5, 69]}
      h5: {what: mounting_hole, adjust.shift: [160.7, 68]}
      h6: {what: mounting_hole, adjust.shift: [139.5, -30]}
  mono:
    template: kicad5
    outlines:
      edge:
        outline: pcb_mono
        layer: Edge.Cuts
    footprints:
      choc:
        what: choc
        where: /^(matrix|thumb|mirror)_/
        params: {hotswap: true, keycaps: true, from: "{{colrow}}", to: "{{mono_col}}"}
      diode:
        what: diode_sod123
        where: /^(matrix|thumb|mirror)_/
        adjust: {shift: [0, -5.3]}
        params: {from: "{{colrow}}", to: "{{mono_row}}"}
      mcu:
        what: promicro
        adjust: {shift: [131, 52], rotate: -90}
        params:
          P4: MR0
          P5: MR1
          P6: MR2
          P7: MR3
          P8: MR4
          P9: MR5
          P21: MC0
          P20: MC1
          P19: MC2
          P18: MC3
          P15: MC4
          P14: MC5
          P16: MC6
          P10: MC7
          P0: MC8
          P1: CS
          P2: MOSI
          P3: SCK
      display:
        what: nice_view
        adjust: {shift: [131, 49.6]}
      power:
        what: power_switch
        adjust: {shift: [114, 68], rotate: 0}
        params: {from: BAT_P, to: RAW}
      battery:
        what: battery_pads
        adjust: {shift: [131, 25.5]}
        params: {pos: BAT_P, neg: GND}
      reset:
        what: button
        adjust: {shift: [118, 28], rotate: 90}
        params: {side: F, from: RST, to: GND}
      h1: {what: mounting_hole, adjust.shift: [-8, 66]}
      h2: {what: mounting_hole, adjust.shift: [-8, -28]}
      h3: {what: mounting_hole, adjust.shift: [40, -24]}
      h4: {what: mounting_hole, adjust.shift: [47.5, 69]}
      h5: {what: mounting_hole, adjust.shift: [101.3, 68]}
      h6: {what: mounting_hole, adjust.shift: [122.5, -30]}
      h7: {what: mounting_hole, adjust.shift: [270, 66]}
      h8: {what: mounting_hole, adjust.shift: [270, -28]}
      h9: {what: mounting_hole, adjust.shift: [222, -24]}
      h10: {what: mounting_hole, adjust.shift: [214.5, 69]}
      h11: {what: mounting_hole, adjust.shift: [160.7, 68]}
      h12: {what: mounting_hole, adjust.shift: [139.5, -30]}
